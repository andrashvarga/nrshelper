name: Build iOS
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: noros-ios-project
    steps:
      - uses: actions/checkout@v4
      - name: Apply update folder
        run: |
          if [ -d noros-ios-update ]; then cp -R noros-ios-update/. .; fi
          grep -c NOROS_NATIVE_IOS Resources/web/index.html || true
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project NorosHelper.xcodeproj -scheme NorosHelper -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/NorosHelper.app out/Payload/
          (cd out && zip -qr NorosHelper-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: NorosHelper-unsigned-ipa
          path: noros-ios-project/out/NorosHelper-unsigned.ipa
